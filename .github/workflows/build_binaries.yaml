name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    # NOTE: Using submodule to pin the version
    #with:
    #  qmk_repo: qmk/qmk_firmware
    #  qmk_ref: master

  publish:
    name: 'QMK Userspace Publish'
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
    # The reusable workflow deletes and recreates the `latest` release, with no
    # ref check of its own. Without this, a branch push replaces main's release.
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    needs: build
