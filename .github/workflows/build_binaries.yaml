name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  targets:
    name: 'QMK Userspace Targets'
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.check.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        # The build uploads no artifact when there is nothing to build, and its
        # upload step is continue-on-error, so publish would fail on an empty
        # download rather than skip.
        run: echo "any=$(jq '.build_targets | length > 0' qmk.json)" >> "$GITHUB_OUTPUT"

  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    # NOTE: Using submodule to pin the version
    with:
      # A branch whose keyboard is not in upstream yet carries it as a diff
      # against the pinned submodule. main has none, so this does nothing there.
      # safe.directory: the container user does not own the checkout.
      # nowarn: the patches carry upstream files as they are, trailing
      # whitespace included.
      preparation_command: |
        for p in ci/patches/*.patch; do
          [ -e "$p" ] || continue
          echo "Applying $p"
          git -c safe.directory='*' -C qmk_firmware apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p" || exit 1
        done

  publish:
    name: 'QMK Userspace Publish'
    # Our own job, not qmk_userspace_publish.yml: that one hard-codes the
    # release title and always makes a full release, so a branch release took
    # the "Latest" badge from main's.
    # Without the ref check, a branch push replaces main's release. Other
    # branches publish to their own tag only when the RELEASE_BRANCHES repo
    # variable (a JSON list) names them, so feature branches only build.
    if: >-
      always() && !cancelled() && needs.targets.outputs.any == 'true' &&
      (github.ref == 'refs/heads/main' || contains(fromJSON(vars.RELEASE_BRANCHES || '[]'), github.ref_name))
    needs: [build, targets]
    runs-on: ubuntu-latest
    env:
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
      TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || format('latest-{0}', github.ref_name) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: Firmware

      - name: Delete release
        run: gh release delete "$TAG" --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          name: QMK Firmware (${{ github.ref_name }})
          tag_name: ${{ env.TAG }}
          # The tag is new each time, and without this it is made from the
          # default branch, so a branch release shows main's commit.
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.IS_MAIN != 'true' }}
          make_latest: ${{ env.IS_MAIN == 'true' }}
          fail_on_unmatched_files: false
          files: |
            **/*.hex
            **/*.bin
            **/*.uf2
